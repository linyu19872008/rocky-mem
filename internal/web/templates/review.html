<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{.Title}}</title>
  <style>
    :root { --bg:#f6f4ef; --ink:#1a1a1a; --muted:#5c5c5c; --line:#d8d2c4; --ok:#0a7a3e; --bad:#a40000; --accent:#0b5fff; --contested:#7a3b00; --proposed:#1a4f8a; }
    body { margin:0; font:15px/1.45 "IBM Plex Sans", "Segoe UI", sans-serif; background:linear-gradient(160deg,#f6f4ef,#ebe6da); color:var(--ink); min-height:100vh; }
    header { padding:1.25rem 1.5rem; border-bottom:1px solid var(--line); display:flex; gap:1rem; align-items:baseline; flex-wrap:wrap; }
    header strong { font-size:1.15rem; }
    nav a { color:var(--muted); text-decoration:none; margin-right:0.75rem; }
    nav a:hover { color:var(--accent); }
    main { max-width:960px; margin:0 auto; padding:1.5rem; }
    .filters { display:flex; gap:0.4rem; flex-wrap:wrap; margin-bottom:1rem; }
    .filters button { padding:0.35rem 0.7rem; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; font:inherit; color:var(--muted); }
    .filters button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
    .row { background:#fff; border:1px solid var(--line); border-radius:8px; padding:0.9rem 1rem; margin-bottom:0.6rem; display:flex; gap:1rem; justify-content:space-between; align-items:flex-start; }
    .row.contested { border-left:4px solid #f0c36d; }
    .row.proposed { border-left:4px solid #9dbcf0; }
    .row h3 { margin:0 0 0.25rem; font-size:1rem; display:flex; gap:0.45rem; align-items:center; flex-wrap:wrap; }
    .row h3 a { color:inherit; text-decoration:none; }
    .row h3 a:hover { color:var(--accent); }
    .row p { margin:0; color:var(--muted); font-size:0.85rem; }
    .badge { display:inline-block; font-size:0.72rem; font-weight:600; letter-spacing:0.02em; padding:0.12rem 0.4rem; border-radius:4px; text-transform:uppercase; }
    .badge.contested { background:#fff4e5; color:var(--contested); border:1px solid #f0c36d; }
    .badge.proposed { background:#e8f1ff; color:var(--proposed); border:1px solid #9dbcf0; }
    .actions { display:flex; gap:0.4rem; flex-shrink:0; flex-wrap:wrap; }
    button { padding:0.4rem 0.7rem; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; font:inherit; }
    button.ok { background:var(--ok); color:#fff; border-color:var(--ok); }
    button.bad { background:var(--bad); color:#fff; border-color:var(--bad); }
    button.linkish { color:var(--accent); }
    .group { margin:1.25rem 0 0.5rem; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); }
    .empty, .err { color:var(--muted); }
    .err { color:var(--bad); }
  </style>
</head>
<body>
  <header>
    <strong>rocky-mem</strong>
    <nav><a href="/">Search</a><a href="/review">Review</a><a href="/entry">Entry</a><a href="/settings">Settings</a></nav>
  </header>
  <main>
    <div class="filters" id="filters">
      <button type="button" data-f="all" class="on">All</button>
      <button type="button" data-f="proposed">Proposed</button>
      <button type="button" data-f="contested">Contested</button>
    </div>
    <p class="empty" id="status">Loading…</p>
    <div id="list"></div>
  </main>
  <script>
    const list = document.getElementById('list');
    const status = document.getElementById('status');
    let filter = 'all';
    let cache = [];

    document.getElementById('filters').onclick = (ev) => {
      const btn = ev.target.closest('button[data-f]');
      if (!btn) return;
      filter = btn.dataset.f;
      for (const b of document.querySelectorAll('#filters button')) b.classList.toggle('on', b === btn);
      render();
    };

    async function api(path, body) {
      const res = await fetch(path, {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {})
      });
      const data = await res.json();
      if (!res.ok) throw new Error((data.error && data.error.message) || res.statusText);
      return data;
    }

    function badge(trust) {
      return '<span class="badge ' + trust + '">' + trust + '</span>';
    }

    function render() {
      list.innerHTML = '';
      const rows = cache.filter(r => filter === 'all' || r.trust === filter);
      if (!rows.length) {
        status.textContent = cache.length ? 'No rows for this filter.' : 'No proposed/contested experiences.';
        return;
      }
      status.textContent = rows.length + ' awaiting review' + (filter !== 'all' ? ' · ' + filter : '');

      const groups = new Map();
      for (const r of rows) {
        const key = r.conflict_group || (r.trust === 'contested' ? '_contested_ungrouped' : '_proposed');
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(r);
      }

      for (const [key, items] of groups) {
        const label = key === '_proposed' ? 'Proposed'
          : key === '_contested_ungrouped' ? 'Contested (no group)'
          : 'Conflict group · ' + key;
        const g = document.createElement('div');
        g.className = 'group';
        g.textContent = label;
        list.appendChild(g);

        for (const r of items) {
          const el = document.createElement('div');
          el.className = 'row ' + (r.trust || '');
          el.innerHTML = '<div><h3><a></a></h3><p></p></div><div class="actions"></div>';
          const link = el.querySelector('a');
          link.href = '/entry?uid=' + encodeURIComponent(r.uid);
          link.textContent = r.title;
          link.insertAdjacentHTML('afterend', ' ' + badge(r.trust));
          const bits = [r.uid, r.exp_type || '', 'conf ' + (r.confidence ?? '')];
          if (r.symptom) bits.push(r.symptom.slice(0, 80));
          el.querySelector('p').textContent = bits.filter(Boolean).join(' · ');
          const actions = el.querySelector('.actions');
          if (r.conflict_group) {
            const c = document.createElement('button');
            c.className = 'linkish';
            c.textContent = 'Compare';
            c.onclick = () => { location.href = '/entry?uid=' + encodeURIComponent(r.uid); };
            actions.appendChild(c);
          }
          const a = document.createElement('button'); a.className='ok'; a.textContent='Approve';
          a.onclick = async () => { await api('/api/v1/review/approve', { uid: r.uid }); refresh(); };
          const b = document.createElement('button'); b.className='bad'; b.textContent='Reject';
          b.onclick = async () => { await api('/api/v1/review/reject', { uid: r.uid, reason: 'web-reject' }); refresh(); };
          actions.append(a, b);
          list.appendChild(el);
        }
      }
    }

    async function refresh() {
      status.className = 'empty';
      status.textContent = 'Loading…';
      list.innerHTML = '';
      try {
        cache = await api('/api/v1/review/list', { trusts: ['proposed','contested'], limit: 50 }) || [];
        render();
      } catch (err) {
        status.className = 'err';
        status.textContent = String(err);
      }
    }
    refresh();
  </script>
</body>
</html>
