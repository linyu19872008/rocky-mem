<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{.Title}}</title>
  <style>
    :root { --ink:#1a1a1a; --muted:#5c5c5c; --line:#d8d2c4; --ok:#0a7a3e; --bad:#a40000; --accent:#0b5fff; --warn:#9a6700; --contested:#7a3b00; --proposed:#1a4f8a; }
    body { margin:0; font:15px/1.45 "IBM Plex Sans", "Segoe UI", sans-serif; background:linear-gradient(160deg,#f6f4ef,#ebe6da); color:var(--ink); min-height:100vh; }
    header { padding:1.25rem 1.5rem; border-bottom:1px solid var(--line); display:flex; gap:1rem; align-items:baseline; flex-wrap:wrap; }
    header strong { font-size:1.15rem; }
    nav a { color:var(--muted); text-decoration:none; margin-right:0.75rem; }
    nav a:hover { color:var(--accent); }
    main { max-width:1100px; margin:0 auto; padding:1.5rem; }
    h1 { font-size:1.25rem; margin:0 0 0.5rem; display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap; }
    .meta, .field { color:var(--muted); font-size:0.9rem; margin:0.25rem 0; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:8px; padding:1rem; margin:0.75rem 0; }
    .panel h2 { margin:0 0 0.5rem; font-size:1rem; }
    .banner { border-radius:8px; padding:0.75rem 1rem; margin:0.5rem 0 1rem; font-size:0.95rem; }
    .banner.contested { background:#fff4e5; border:1px solid #f0c36d; color:var(--contested); }
    .banner.proposed { background:#e8f1ff; border:1px solid #9dbcf0; color:var(--proposed); }
    .badge { display:inline-block; font-size:0.75rem; font-weight:600; letter-spacing:0.02em; padding:0.15rem 0.45rem; border-radius:4px; text-transform:uppercase; }
    .badge.contested { background:#fff4e5; color:var(--contested); border:1px solid #f0c36d; }
    .badge.proposed { background:#e8f1ff; color:var(--proposed); border:1px solid #9dbcf0; }
    .badge.active { background:#e6f6ec; color:var(--ok); border:1px solid #8fd6a8; }
    .badge.archived, .badge.stale { background:#f3f3f3; color:var(--muted); border:1px solid var(--line); }
    .compare { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; }
    @media (max-width:800px) { .compare { grid-template-columns:1fr; } }
    .col { background:#fff; border:1px solid var(--line); border-radius:8px; padding:0.85rem; min-width:0; }
    .col.current { border-color:var(--accent); box-shadow:0 0 0 1px rgba(11,95,255,0.15); }
    .col.peer { border-color:#f0c36d; }
    .col h3 { margin:0 0 0.4rem; font-size:0.95rem; }
    .col h3 a { color:var(--accent); text-decoration:none; }
    .col .label { font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); margin-top:0.55rem; }
    .col pre { white-space:pre-wrap; margin:0.2rem 0 0; font:12.5px/1.4 ui-monospace, monospace; max-height:12rem; overflow:auto; }
    .actions { display:flex; gap:0.4rem; flex-wrap:wrap; margin-top:0.75rem; }
    button, .btn { padding:0.45rem 0.75rem; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; font:inherit; text-decoration:none; color:inherit; display:inline-block; }
    button.ok { background:var(--ok); color:#fff; border-color:var(--ok); }
    button.bad { background:var(--bad); color:#fff; border-color:var(--bad); }
    button.warn { background:var(--warn); color:#fff; border-color:var(--warn); }
    .err { color:var(--bad); }
    a.peer { color:var(--accent); }
    pre { white-space:pre-wrap; margin:0; font:13px/1.4 ui-monospace, monospace; }
    textarea { width:100%; min-height:4rem; margin-top:0.5rem; font:inherit; padding:0.5rem; border:1px solid var(--line); border-radius:6px; box-sizing:border-box; }
  </style>
</head>
<body>
  <header>
    <strong>rocky-mem</strong>
    <nav><a href="/">Search</a><a href="/review">Review</a><a href="/entry">Entry</a><a href="/settings">Settings</a></nav>
  </header>
  <main>
    <p id="status" class="meta">Loading…</p>
    <div id="root"></div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const uid = (params.get('uid') || '').trim();
    const status = document.getElementById('status');
    const root = document.getElementById('root');

    async function api(path, body) {
      const res = await fetch(path, {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {})
      });
      const data = await res.json();
      if (!res.ok) throw new Error((data.error && data.error.message) || res.statusText);
      return data;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function field(label, val) {
      if (val === undefined || val === null || val === '') return '';
      return '<div class="field"><b>' + label + ':</b> ' + escapeHtml(String(val)) + '</div>';
    }

    function badge(trust) {
      const t = trust || 'unknown';
      return '<span class="badge ' + escapeHtml(t) + '">' + escapeHtml(t) + '</span>';
    }

    function colBlock(title, href, trust, fields, cls) {
      let h = '<div class="col ' + cls + '"><h3>';
      if (href) h += '<a href="' + href + '">' + escapeHtml(title) + '</a>';
      else h += escapeHtml(title);
      h += ' ' + badge(trust) + '</h3>';
      for (const [label, val] of fields) {
        if (val === undefined || val === null || val === '') continue;
        h += '<div class="label">' + escapeHtml(label) + '</div><pre>' + escapeHtml(String(val)) + '</pre>';
      }
      return h + '</div>';
    }

    async function load() {
      if (!uid) {
        status.textContent = 'Pass ?uid=m_… or e_…';
        root.innerHTML = '<form id="go"><input name="uid" placeholder="e_… / m_…" style="padding:0.5rem;width:70%"/> <button type="submit">Open</button></form>';
        document.getElementById('go').onsubmit = (e) => {
          e.preventDefault();
          const v = e.target.uid.value.trim();
          if (v) location.search = '?uid=' + encodeURIComponent(v);
        };
        return;
      }
      status.textContent = 'Loading ' + uid + '…';
      try {
        const data = await api('/api/v1/get', { uid, include_raw: true });
        status.textContent = data.type + ' · ' + data.uid;
        const e = data.entry || {};
        let html = '<h1>' + escapeHtml(e.title || data.uid) + ' ' + badge(e.trust || e.status) + '</h1>';

        if (e.trust === 'contested') {
          html += '<div class="banner contested">Contested — peers disagree. Compare below, then approve one side or mark feedback.</div>';
        } else if (e.trust === 'proposed') {
          html += '<div class="banner proposed">Proposed — awaiting human review before it becomes authoritative.</div>';
        }

        html += field('type', e.exp_type || e.mem_type);
        html += field('scope', (e.scope || '') + (e.scope_ref ? '/' + e.scope_ref : ''));
        html += field('confidence', e.confidence);
        html += field('outcome', e.outcome);
        html += field('applies_when', e.applies_when);
        html += field('invalid_when', e.invalid_when);
        html += field('symptom', e.symptom);
        html += field('root_cause', e.root_cause);
        html += field('conflict_group', e.conflict_group);
        if (e.fix_md) html += '<div class="panel"><h2>Fix</h2><pre>' + escapeHtml(e.fix_md) + '</pre></div>';
        if (e.body_md) html += '<div class="panel"><h2>Body</h2><pre>' + escapeHtml(e.body_md) + '</pre></div>';

        if (data.related && data.related.length) {
          html += '<div class="panel"><h2>Conflict compare</h2><div class="compare">';
          html += colBlock(
            e.title || data.uid,
            null,
            e.trust,
            [
              ['symptom', e.symptom],
              ['fix', e.fix_md],
              ['applies_when', e.applies_when],
              ['invalid_when', e.invalid_when],
              ['outcome', e.outcome],
              ['confidence', e.confidence],
            ],
            'current'
          );
          for (const r of data.related) {
            html += colBlock(
              r.title || r.uid,
              '/entry?uid=' + encodeURIComponent(r.uid),
              r.trust,
              [
                ['symptom', r.symptom],
                ['fix', r.fix_md],
                ['applies_when', r.applies_when],
                ['invalid_when', r.invalid_when],
                ['outcome', r.outcome],
                ['confidence', r.confidence],
                ['relation', r.relation],
              ],
              'peer'
            );
          }
          html += '</div></div>';
        }

        if (data.evidence && data.evidence.length) {
          html += '<div class="panel"><h2>Evidence</h2>';
          for (const ev of data.evidence) {
            const quote = ev.quote || ev.excerpt || '';
            html += '<div class="field"><b>' + escapeHtml(ev.role || 'evidence') + '</b>' +
              (ev.channel ? ' · ' + escapeHtml(ev.channel) : '') +
              (quote ? '<pre>' + escapeHtml(quote) + '</pre>' : '') + '</div>';
          }
          html += '</div>';
        }

        html += '<div class="panel"><h2>Raw JSON</h2><pre id="raw"></pre></div>';
        html += '<div class="actions" id="actions"></div>';
        html += '<div class="panel"><h2>Feedback</h2><textarea id="note" placeholder="note (required for wrong)"></textarea><div class="actions" id="fb"></div></div>';
        root.innerHTML = html;
        document.getElementById('raw').textContent = JSON.stringify(data, null, 2);

        const actions = document.getElementById('actions');
        if (data.type === 'experience' && (e.trust === 'proposed' || e.trust === 'contested')) {
          const a = document.createElement('button'); a.className = 'ok'; a.textContent = 'Approve';
          a.onclick = async () => { await api('/api/v1/review/approve', { uid: data.uid }); load(); };
          const b = document.createElement('button'); b.className = 'bad'; b.textContent = 'Reject';
          b.onclick = async () => { await api('/api/v1/review/reject', { uid: data.uid, reason: 'web-reject' }); load(); };
          actions.append(a, b);
        }

        const fb = document.getElementById('fb');
        for (const outcome of ['helpful', 'wrong', 'stale']) {
          const btn = document.createElement('button');
          if (outcome === 'wrong') btn.className = 'warn';
          btn.textContent = outcome;
          btn.onclick = async () => {
            const note = document.getElementById('note').value.trim();
            await api('/api/v1/feedback', { uid: data.uid, outcome, note });
            load();
          };
          fb.appendChild(btn);
        }
      } catch (err) {
        status.className = 'err';
        status.textContent = String(err);
      }
    }
    load();
  </script>
</body>
</html>
