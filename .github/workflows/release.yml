name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # internal/web embeds web/dist; a release without it ships an empty UI.
      - name: Build web assets
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      - name: Assert the tag matches the embedded version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "const Version = \"$tag\"" internal/version/version.go \
            || { echo "tag $tag != internal/version/version.go"; exit 1; }

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
