name: release

on:
  push:
    tags: ['v*']
  # Lets a maintainer exercise the release pipeline (and any action upgrade in
  # it) without inventing a tag: snapshot mode builds every target, publishes
  # nothing.
  workflow_dispatch:
    inputs:
      snapshot:
        description: Build a snapshot without publishing or creating a release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.26.x'
          cache: true

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # internal/web embeds web/dist; a release without it ships an empty UI.
      - name: Build web assets
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      - name: Assert the tag matches the embedded version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "const Version = \"$tag\"" internal/version/version.go \
            || { echo "tag $tag != internal/version/version.go"; exit 1; }

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ (github.event_name == 'workflow_dispatch' && inputs.snapshot) && 'release --snapshot --clean' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
