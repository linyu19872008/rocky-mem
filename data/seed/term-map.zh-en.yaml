    domain: database
  - zh: 迁移
    en: [migration, migrate]
    domain: database
  - zh: 备份
    en: [backup, snapshot]
    domain: storage
  - zh: 分片
    en: [shard, sharding, chunk]
    domain: storage

  # --- build / tooling ---
  - zh: 依赖
    en: [dependency, dependencies]
    domain: build
  - zh: 构建
    en: [build, compile]
    domain: build
  - zh: 缓存
    en: [cache, caching]
