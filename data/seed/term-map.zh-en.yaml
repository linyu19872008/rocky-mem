# Seed term map: zh-CN → en
#
# Used by query expansion (docs/i18n.md §6.3). Loaded into the `term` table with
# `source = 'seed'`. Each `zh` entry expands to every listed `en` term at the
# default weight (0.7), so original-language hits outrank bridged ones.
#
# Quality bar for contributions:
#   1. The mapping must be unambiguous in an engineering context. If a term has
#      two plausible English meanings, either pick the one this project means, or
#      leave it out. "内存" is deliberately absent: memory or RAM is decided by
#      context, and a wrong mapping is worse than no mapping.
#   2. Prefer the term an English-speaking engineer would actually type into a
#      search box, not a dictionary translation.
#   3. Multi-word entries are fine; they are matched as phrases.
#
# Adding a term requires: this file, a test case using a real query, and review.

version: 1
direction: zh-CN -> en

entries:
  # --- hardware / GPU ---
  - zh: 显存
    en: [VRAM, "video memory", "GPU memory"]
    domain: gpu
  - zh: 显卡
    en: [GPU, "graphics card"]
    domain: gpu
  - zh: 显存不足
    en: ["out of memory", OOM, "CUDA OOM"]
    domain: gpu
  - zh: 驱动
    en: [driver]
    domain: gpu

  # --- deployment / infra ---
  - zh: 灰度发布
    en: [canary, "canary release", "gradual rollout"]
    domain: deploy
  - zh: 滚动更新
    en: ["rolling update", "rolling upgrade", rollout]
    domain: deploy
  - zh: 回滚
    en: [rollback, revert]
    domain: deploy
  - zh: 热更新
    en: ["hot reload", "hot update", "config reload"]
    domain: config
  - zh: 配置
    en: [config, configuration, ConfigMap]
    domain: config
  - zh: 副本
    en: [replica]
    domain: deploy
  - zh: 探针
    en: [probe, livenessProbe, readinessProbe]
    domain: deploy
  - zh: 容器
    en: [container, Pod]
    domain: deploy
  - zh: 节点
